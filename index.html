<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CHEVON Rhythm">

<link rel="manifest" href="manifest.webmanifest">
<title>CHEVON 3D Rhythm Stage</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:#05060d;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;overscroll-behavior:none}
body{touch-action:manipulation}
.wrap{width:min(1120px,100%);margin:auto;padding:9px}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
h1{font-size:21px;margin:0;font-weight:950}.sub{opacity:.68;font-size:12px}
.panel{margin-top:9px;background:#111522;border:1px solid #293249;border-radius:16px;padding:10px}
.songgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:7px;max-height:170px;overflow:auto;-webkit-overflow-scrolling:touch}
.song{min-height:52px;text-align:left;color:#fff;background:#1a2131;border:1px solid #34405a;border-radius:10px;padding:8px;cursor:pointer}.song.sel{outline:3px solid #fff;background:#2b3550}
.song b{display:block}.song small{opacity:.6}
.diffs{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.diff,.primary,.secondary{min-height:43px;border-radius:10px;font-weight:850}.diff{border:0;padding:8px 12px;background:#303a51;color:#fff}.diff.active{background:#e94c67}
.speed{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-top:8px}.speed input{width:min(340px,100%)}
.primary{border:0;padding:10px 16px;background:#fff;color:#080b12}.secondary{border:1px solid #394661;padding:9px 13px;background:#192136;color:#fff}
.stats{display:flex;gap:13px;flex-wrap:wrap;margin:7px 0;font-weight:850}
.stage{position:relative;width:100%;height:min(72vh,660px);min-height:430px;overflow:hidden;border-radius:16px;border:1px solid #38435f;
background:
radial-gradient(ellipse at 50% 18%,rgba(95,118,255,.22),transparent 33%),
linear-gradient(180deg,#171b31 0%,#0c0e18 63%,#05060b 100%);
perspective:1000px;touch-action:none}
.stage:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,transparent 65%,rgba(80,60,180,.10))}
.field{position:absolute;left:4%;right:4%;top:0;bottom:0;overflow:hidden;clip-path:polygon(37% 0,63% 0,97% 100%,3% 100%);background:
linear-gradient(180deg,rgba(45,50,90,.18),rgba(8,9,16,.85)),
repeating-linear-gradient(0deg,transparent 0 58px,rgba(150,170,255,.08) 59px 60px);
border-left:1px solid rgba(160,170,255,.45);border-right:1px solid rgba(160,170,255,.45);
transform:translateZ(0)}
.field:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent 0 49.8%,rgba(255,255,255,.08) 50%,transparent 50.2%);pointer-events:none}
.laneLine{position:absolute;top:0;bottom:0;width:2px;background:linear-gradient(180deg,rgba(255,255,255,.13),rgba(156,120,255,.72));transform-origin:top;pointer-events:none}
.l1{left:20%;transform:skewX(-21deg)}.l2{left:40%;transform:skewX(-10deg)}.l3{left:60%;transform:skewX(10deg)}.l4{left:80%;transform:skewX(21deg)}
.spotlight{position:absolute;top:-8%;width:34%;height:72%;pointer-events:none;opacity:.24;filter:blur(12px);background:linear-gradient(180deg,rgba(154,128,255,.42),transparent 75%);transform-origin:top}.spotlight.left{left:4%;transform:rotate(15deg) skewX(-10deg)}.spotlight.right{right:4%;transform:rotate(-15deg) skewX(10deg)}
.horizon{position:absolute;left:31%;right:31%;top:8%;height:36%;border:1px solid rgba(255,255,255,.13);transform:perspective(600px) rotateX(58deg);transform-origin:bottom;background:rgba(255,255,255,.025)}
.gridline{position:absolute;left:8%;right:8%;height:2px;background:rgba(180,190,255,.15);transform-origin:center;pointer-events:none}
.judgeLine{position:absolute;left:3.5%;right:3.5%;bottom:77px;height:7px;border-radius:99px;background:#fff;z-index:22;box-shadow:0 0 0 2px #151726,0 0 18px #aa92ff}
.laneTouch{position:absolute;inset:0;z-index:25;display:grid;grid-template-columns:repeat(5,1fr);clip-path:polygon(37% 0,63% 0,97% 100%,3% 100%);pointer-events:auto}.laneTouch button{border:0;background:transparent;touch-action:none}.laneTouch button:active{background:rgba(255,255,255,.06)}
.judgeLabel{position:absolute;left:50%;bottom:34px;transform:translateX(-50%);z-index:23;padding:5px 14px;border:2px solid #fff;border-radius:999px;background:#090b14dd;font-weight:950;white-space:nowrap}
.note{position:absolute;z-index:18;height:40px;width:62px;transform:translate(-50%,-50%) skewX(-7deg);border:2px solid #fff;border-radius:5px;background:linear-gradient(180deg,#ffffff,#8ceaff);box-shadow:0 4px 12px #000b,0 0 12px #66d9ff;will-change:left,top,width,height}
.note:after{content:"";position:absolute;left:10px;right:10px;top:50%;height:5px;transform:translateY(-50%);border-radius:99px;background:#fff;opacity:.9}
.note.flick{background:linear-gradient(180deg,#f1e3ff,#9361ff);box-shadow:0 4px 12px #000b,0 0 13px #ad7cff}.note.flick:after{content:"↑";height:auto;background:none;left:0;right:0;top:44%;font-size:24px;text-align:center;color:#fff}
.note.hold{background:linear-gradient(180deg,#d5fbff,#5db8ff)}
.holdBody{position:absolute;z-index:11;height:10px;border-radius:9px;background:linear-gradient(90deg,#57bfff,#ecffff,#57bfff);box-shadow:0 0 10px #55c7ff;transform:translateX(-50%);pointer-events:none}
.score{position:absolute;right:12px;top:10px;z-index:30;font-weight:950}.combo{position:absolute;left:0;right:0;top:21px;text-align:center;z-index:30;font-size:36px;font-weight:1000;text-shadow:0 4px 14px #000}
.judge{position:absolute;left:0;right:0;top:84px;text-align:center;z-index:30;font-size:39px;font-weight:1000;opacity:0;text-shadow:0 4px 14px #000}.judge.show{animation:j .43s ease}
@keyframes j{0%{opacity:1;transform:scale(.75)}100%{opacity:0;transform:scale(1.15)}}
.tapbar{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:8px}.tapkey{min-height:58px;border:1px solid #566382;border-radius:11px;background:linear-gradient(#27334e,#151a2b);color:#fff;font-weight:950;font-size:15px;touch-action:none;user-select:none}.tapkey.active{background:#fff;color:#111;box-shadow:0 0 18px #fff;transform:scale(.97)}
.help{font-size:11px;opacity:.68;line-height:1.45;margin-top:7px}
@media(max-width:650px){.wrap{padding:7px}.panel{padding:9px}.stage{height:62vh;min-height:390px}.songgrid{grid-template-columns:repeat(2,minmax(0,1fr));max-height:150px}.note{width:50px;height:34px}.tapkey{min-height:54px}.judgeLine{bottom:72px}.judgeLabel{bottom:31px;font-size:11px}}
@media(prefers-reduced-motion:reduce){.judge.show{animation:none;opacity:1}}

/* Original mobile rhythm-game HUD styling */
.hudTop{position:absolute;left:16px;right:16px;top:14px;z-index:31;display:flex;align-items:center;justify-content:space-between;pointer-events:none}
.life{display:flex;align-items:center;gap:8px;width:42%;max-width:310px}.life>span{font-size:20px;text-shadow:0 2px 8px #000}.life i{display:block;flex:1;height:11px;border:2px solid #fff;border-radius:99px;background:#171a27;box-shadow:0 2px 10px #0008;overflow:hidden}.life b{display:block;width:100%;height:100%;background:linear-gradient(90deg,#ff6b8b,#fff);border-radius:99px;transition:width .12s}
.hudScore{min-width:120px;text-align:right;text-shadow:0 2px 9px #000}.hudScore small{display:block;font-size:9px;letter-spacing:2px;opacity:.8}.hudScore strong{display:block;font-size:24px;line-height:1}
.songHud{position:absolute;left:50%;top:62px;transform:translateX(-50%);z-index:31;text-align:center;pointer-events:none;text-shadow:0 2px 9px #000;white-space:nowrap}.songHud b{display:block;font-size:13px}.songHud span{font-size:9px;opacity:.7;letter-spacing:2px}
.combo{top:92px;font-size:42px;letter-spacing:1px}
.judge{top:138px}
.stage{border-radius:20px;background:
radial-gradient(ellipse at 50% 18%,rgba(125,150,255,.30),transparent 31%),
linear-gradient(180deg,#202746 0%,#0e1120 58%,#05060b 100%)}
.field{left:2%;right:2%;clip-path:polygon(36% 0,64% 0,98% 100%,2% 100%)}
.judgeLine{height:9px;left:2%;right:2%;bottom:73px;box-shadow:0 0 0 2px #151726,0 0 22px #fff}
.note{border-radius:6px;height:56px;width:98px;box-shadow:0 5px 16px #000b,0 0 15px #66d9ff}
.note:after{left:16px;right:16px;height:6px}
.tapbar{display:none}
.laneTouch{clip-path:polygon(36% 0,64% 0,98% 100%,2% 100%)}
.laneTouch button{border-left:1px solid rgba(255,255,255,.035)}
@media(max-width:650px){.hudTop{left:10px;right:10px;top:10px}.life{width:45%}.hudScore strong{font-size:20px}.songHud{top:52px}.combo{top:78px;font-size:34px}.judge{top:116px}.stage{height:66vh;min-height:410px}.note{width:82px;height:50px}.judgeLine{bottom:69px}}

/* Original difficulty selector inspired by modern mobile rhythm-game hierarchy */
.prosekaDiffs{display:flex;justify-content:center;align-items:flex-end;gap:10px;margin:14px auto 8px;max-width:680px}
.prosekaDiffs .diff{
  position:relative;width:92px;height:74px;padding:7px 5px 8px;
  border:2px solid rgba(255,255,255,.22);border-radius:13px;
  background:rgba(20,23,38,.86);color:#fff;box-shadow:0 5px 16px #0008;
  transform:translateY(0);transition:.16s;cursor:pointer;overflow:hidden
}
.prosekaDiffs .diff span{display:block;font-size:10px;font-weight:800;letter-spacing:.7px}
.prosekaDiffs .diff b{display:block;font-size:28px;line-height:1.05;margin-top:5px}
.prosekaDiffs .diff:after{content:"";position:absolute;left:0;right:0;bottom:0;height:5px;background:#777}
.prosekaDiffs .d-easy:after{background:#63d66e}.prosekaDiffs .d-normal:after{background:#55c8ef}
.prosekaDiffs .d-hard:after{background:#ffae4f}.prosekaDiffs .d-expert:after{background:#ff5964}
.prosekaDiffs .d-master:after{background:#b77cff}
.prosekaDiffs .diff.active{transform:translateY(-8px) scale(1.04);border-color:#fff;background:rgba(44,48,72,.96);box-shadow:0 10px 24px #000b,0 0 18px #fff4}
.prosekaDiffs .d-easy.active{box-shadow:0 10px 24px #000b,0 0 18px #63d66e66}
.prosekaDiffs .d-normal.active{box-shadow:0 10px 24px #000b,0 0 18px #55c8ef66}
.prosekaDiffs .d-hard.active{box-shadow:0 10px 24px #000b,0 0 18px #ffae4f66}
.prosekaDiffs .d-expert.active{box-shadow:0 10px 24px #000b,0 0 18px #ff596466}
.prosekaDiffs .d-master.active{box-shadow:0 10px 24px #000b,0 0 18px #b77cff66}
@media(max-width:650px){
 .prosekaDiffs{gap:5px;margin-top:9px}
 .prosekaDiffs .diff{width:19vw;max-width:82px;height:66px}
 .prosekaDiffs .diff span{font-size:8px}.prosekaDiffs .diff b{font-size:24px}
}

/* iPhone/iPad performance optimization */
.note,.holdBody{backface-visibility:hidden;-webkit-backface-visibility:hidden;}
.note{will-change:transform;contain:layout paint style;left:0;top:0;}
.holdBody{will-change:transform;contain:layout paint style;}
#stage{contain:layout paint style;transform:translateZ(0);}
.holdBody{left:0;top:0;}
.note{width:120px;height:40px;}
.holdBody{width:10px;height:100px;}
.gridline{will-change:transform;}
@media (pointer:coarse){
  .note{box-shadow:0 3px 9px #000a,0 0 8px #66d9ff;}
  .note.flick{box-shadow:0 3px 9px #000a,0 0 9px #ad7cff;}
  .holdBody{box-shadow:0 0 6px #55c7ff;}
}

/* iPhone / iPad optimization */
html,body{width:100%;min-height:100%;-webkit-text-size-adjust:100%;}
body{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);}
button,input{font:inherit;}
button{-webkit-appearance:none;appearance:none;}
.stage{height:min(72svh,660px);min-height:390px;}
@supports (height: 100dvh){.stage{height:min(72dvh,660px);}}
@media (max-width:650px){
  .wrap{width:100%;padding:max(7px,env(safe-area-inset-left)) max(7px,env(safe-area-inset-right));}
  .panel{border-radius:14px;}
  .stage{width:100%;height:min(67svh,720px);min-height:400px;border-radius:18px;}
  @supports (height: 100dvh){.stage{height:min(67dvh,720px);}}
  .prosekaDiffs .diff{touch-action:manipulation;}
}
@media (min-width:651px) and (pointer:coarse){
  .wrap{padding:14px;}
  .stage{height:min(76svh,760px);}
}
@media (orientation:landscape) and (max-height:600px){
  .stage{height:78svh;min-height:300px;}
}

/* Song -> difficulty flow */
.selectTitle{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:7px}.selectTitle small{opacity:.62;font-size:11px}.difficultyScreen{margin-top:4px;padding:10px;border:1px solid #3b4661;border-radius:14px;background:rgba(8,11,22,.72)}.difficultyHead{display:flex;align-items:center;gap:10px;margin-bottom:10px}.difficultyHead>div{display:flex;flex-direction:column}.difficultyHead small{font-size:9px;letter-spacing:1.5px;opacity:.55}.difficultyHead strong{font-size:20px}.selectedDiffText{text-align:center;margin:4px 0 9px;opacity:.82}.startLarge{width:100%;font-size:16px}.song{transition:transform .12s ease,background .12s ease}.song:active{transform:scale(.98)}
</style>
<style id="image-match-lane-style">
/* 画像イメージ合わせ：5レーンの外周を水色、4本の内側境界を紫白にする */
.field{
  position:absolute !important;
  inset:0 !important;
  clip-path:none !important;
  overflow:hidden !important;
  background:
    linear-gradient(180deg,rgba(20,36,86,.34),rgba(7,10,28,.70) 72%,rgba(4,6,18,.88)),
    repeating-linear-gradient(0deg,transparent 0 58px,rgba(140,170,255,.07) 59px 60px) !important;
  border:0 !important;
  transform:none !important;
  pointer-events:none;
}
.field:before{display:none !important}
.laneFrame{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.laneFrame path{fill:none;stroke:rgba(190,185,255,.72);stroke-width:.18;vector-effect:non-scaling-stroke;filter:drop-shadow(0 0 2px rgba(145,125,255,.32))}
.laneFrame path.outer{stroke:#159eff;stroke-width:.34;filter:drop-shadow(0 0 3px rgba(20,160,255,.75))}
/* 画像と同じ、ステージ外側は背景を残して台形だけを薄く浮かせる */
.stage:before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 18%,rgba(80,110,255,.20),transparent 35%),linear-gradient(180deg,transparent 60%,rgba(70,60,190,.10));z-index:0}
.stage:after{background:linear-gradient(180deg,transparent 58%,rgba(75,62,190,.12)) !important;z-index:1}
.field{z-index:2}
#grid{z-index:3 !important}
/* ノーツの中心を、画像の5レーン中心線に合わせて直線的に広げる */
.note{transform:translate(-50%,-50%) skewX(0deg) !important;border-radius:5px !important}
.note:after{border-radius:99px}
.holdBody{z-index:11}
.judgeLine{left:4% !important;right:4% !important;bottom:77px !important;height:7px !important;box-shadow:0 0 0 2px #151726,0 0 18px #aa92ff !important}
.laneTouch{clip-path:polygon(40% 0,60% 0,96% 100%,4% 100%) !important;z-index:25}
@media(max-width:650px){.judgeLine{bottom:69px !important}.laneTouch{clip-path:polygon(40% 0,60% 0,96% 100%,4% 100%) !important}}
</style>

<style id="image-match-fast-note-fix">
/* 参考画像どおり：シアンの外周＋4本の紫ラインで5レーン */
.field{
  left:0 !important;
  right:0 !important;
  clip-path:none !important;
  background:
    linear-gradient(180deg,rgba(20,28,72,.22),rgba(5,7,18,.88)),
    repeating-linear-gradient(0deg,transparent 0 58px,rgba(150,170,255,.055) 59px 60px);
}
.field:after{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  background:
    linear-gradient(90deg,
      transparent 0 3.0%,
      rgba(24,169,255,.95) 3.0% 3.25%,
      transparent 3.25% 96.75%,
      rgba(24,169,255,.95) 96.75% 97.0%,
      transparent 97.0%);
  clip-path:polygon(40% 0,60% 0,97% 100%,3% 100%);
  filter:drop-shadow(0 0 5px #18a9ff);
}
/* 内側4本は参考画像の収束角を維持 */
.field .laneLine{
  width:2px !important;
  background:linear-gradient(180deg,rgba(255,255,255,.16),rgba(156,120,255,.78)) !important;
}
/* 判定ラインは画像の横幅に合わせる */
.judgeLine{
  left:3% !important;
  right:3% !important;
  height:7px !important;
  bottom:77px !important;
}
/* ノーツ：横長のまま縦だけ薄く */
.note{
  width:78px !important;
  height:24px !important;
  border-radius:5px !important;
  transform:translate(-50%,-50%) !important;
}
.note:after{
  left:13px !important;
  right:13px !important;
  height:4px !important;
}
.note.flick:after{
  left:0 !important;
  right:0 !important;
  height:auto !important;
  font-size:18px !important;
}
/* 参考画像の5レーン外周にタッチ領域も一致 */
.laneTouch{
  clip-path:polygon(40% 0,60% 0,97% 100%,3% 100%) !important;
}
@media(max-width:650px){
  .note{
    width:68px !important;
    height:20px !important;
  }
  .judgeLine{
    left:3% !important;
    right:3% !important;
    bottom:69px !important;
  }
}
</style>


<style id="final-note-visibility-fix">
/* FINAL: note visibility only — do not alter lane coordinates */
.note{
  z-index:40 !important;
  opacity:1 !important;
  visibility:visible !important;
  display:block !important;
  background:#ffffff !important;
  border:3px solid #62ddff !important;
  box-shadow:0 0 0 2px #ffffff,0 0 18px #62ddff,0 5px 16px rgba(0,0,0,.85) !important;
  mix-blend-mode:normal !important;
  filter:none !important;
}
.note:after{
  opacity:1 !important;
  background:#62ddff !important;
}
.note.flick{
  background:#a86cff !important;
  border-color:#ffffff !important;
}
.note.flick:after{
  color:#ffffff !important;
  background:none !important;
}
.note.hold{
  background:#dffcff !important;
}
.holdBody{
  z-index:39 !important;
  opacity:1 !important;
  visibility:visible !important;
  background:#72dfff !important;
  box-shadow:0 0 0 2px #ffffff,0 0 14px #55cfff !important;
  mix-blend-mode:normal !important;
  filter:none !important;
}
</style>

</head>
<body>
<div class="wrap">
<header><div><h1>🎵 CHEVON 3D Rhythm Stage</h1><div class="sub">5レーン / 3D遠近 / 四角ノーツ / iPadマルチタッチ対応</div></div></header>
<div class="panel selectPanel">
<div class="selectTitle"><b>曲を選ぶ</b><small>曲をタップすると難易度を選択できます</small></div>
<div id="songs" class="songgrid"></div>
<div id="difficultyScreen" class="difficultyScreen" hidden>
  <div class="difficultyHead"><button id="backSongs" class="secondary" type="button">‹ 曲一覧</button><div><small>SELECT DIFFICULTY</small><strong id="selectedSongTitle">B612</strong></div></div>
  <div class="diffs prosekaDiffs">
  <button class="diff active d-easy" data-d="簡単"><span>EASY</span><b>5</b></button>
  <button class="diff d-normal" data-d="普通"><span>NORMAL</span><b>10</b></button>
  <button class="diff d-hard" data-d="難しい"><span>HARD</span><b>17</b></button>
  <button class="diff d-expert" data-d="鬼"><span>EXPERT</span><b>24</b></button>
  <button class="diff d-master" data-d="裏鬼"><span>MASTER</span><b>30</b></button>
  </div>
  <div class="selectedDiffText">選択中：<b id="diffName">簡単</b></div>
  <button id="start" class="primary startLarge" type="button">▶ この難易度でスタート</button>
</div>
<div class="speed"><label>ノーツ速度 <b id="speedVal">1.0x</b></label><input id="speed" type="range" min=".6" max="4.0" step=".1" value="1"><button id="speedReset" class="secondary" type="button">リセット</button></div>
<div class="speed"><label>判定調整 <b id="offsetVal">0ms</b></label><input id="offset" type="range" min="-150" max="150" step="5" value="0"></div>
<div class="stats">曲 <span id="songName">B612</span>　難易度 <span id="diffNameStats">簡単</span>　SCORE <span id="score">0</span></div>
<button id="reset" class="secondary" type="button">■ リセット</button>
<div class="help">曲を選択 → 難易度を選択 → スタート、の3ステップです。難易度ごとに密度を調整しています。</div>
</div>
<div class="panel">
<div class="stage" id="stage">
<div class="horizon"></div><div class="spotlight left"></div><div class="spotlight right"></div>
<div class="field">

function buildChart(title){
 const raw=charts[title]; if(!raw)return [];
 const d=difficulties[diff], times=raw.onsets, strengths=raw.strength;
 const out=[]; let last=-999, lastLane=-1;
 // 音源解析で得たオンセット時刻をそのまま使い、ランダムな時刻ズレは入れない。
 for(let i=0;i<times.length;i++){
   const t=times[i], s=strengths[i]??.5;
   if(t<1.0 || t>raw.duration-.45)continue;
   const gap=t-last;
   const density = s>=.78 ? 1 : s>=.60 ? Math.min(1,d.keep+.12) : d.keep;
   const r=(Math.sin((i+1)*12.9898)*43758.5453)%1;
   const keep=density>=1 || (r<0? r+1:r)<density;
   if(!keep && gap<d.min*1.6)continue;
   if(gap<d.min)continue;
   let lane=(i*2 + (s>.72?1:0))%5;
   if(lane===lastLane) lane=(lane+1)%5;
   let type="tap", hold=0;
   if(s>.70 && ((i%17===0)||(i%23===0)) && d.hold>0){ type="hold"; hold=.35+s*.75; }
   else if(s>.62 && ((i%11===0)||(i%19===0)) && d.flick>0) type="flick";
   out.push({t,lane,type,hold,hit:false});
   last=t; lastLane=lane;
   if(s>.74 && d.chord>0){
     const chordGate=((i*37)%100)/100;
     if(chordGate<d.chord){
       let l2=(lane+(i%2?2:3))%5;
       if(l2===lane)l2=(lane+1)%5;
       out.push({t,lane:l2,type:"tap",hold:0,hit:false});
     }
   }
 }
 return out.sort((a,b)=>a.t-b.t || a.lane-b.lane);
}

 for(let i=0;i<9;i++){const x=document.createElement("i");x.className="gridline";x.style.top=(15+i*10.5)+"%";x.style.transform=`perspective(500px) rotateX(64deg) scaleX(${.38+i*.075})`;g.appendChild(x)}
}
makeGrid();addEventListener("resize",makeGrid);

function position(n,now,stageH,stageW){
 const d=difficulties[diff],travel=d.speed*speedMult,dt=n.t-now,target=stageH-77;
 const travelWindow=1.95/Math.max(.6,speedMult); const p=Math.max(0,Math.min(1,1-dt/travelWindow));
 const laneTop=[38.8,44.4,50,55.6,61.2],laneBottom=[11.6,30.8,50,69.2,88.4];
 // レーン境界はSVG上で直線なので、ノーツ中心も同じ直線上を通す。
 // 以前のようにXとYへ別々の指数補間をかけると、途中でレーンから外れる。
 const depth=Math.pow(p,1.32);
 const y=18+(target-18)*depth;
 const laneT=(y-18)/Math.max(1,target-18);
 const x=laneTop[n.lane]+(laneBottom[n.lane]-laneTop[n.lane])*laneT;
 const p2=Math.min(1,p+.012),depth2=Math.pow(p2,1.32);
 const y2=18+(target-18)*depth2;
 const laneT2=(y2-18)/Math.max(1,target-18);
 const x2=laneTop[n.lane]+(laneBottom[n.lane]-laneTop[n.lane])*laneT2;
 const dx=(x2-x)*stageW/100,dy=y2-y;
 const angle=(Math.atan2(dy,dx)*180/Math.PI)-90;
 const tangent=angle+90;
 const scale=.46+1.78*Math.pow(p,1.08);
 const laneGap=stageW*(17.5/100);
 const width=Math.min(78*scale,laneGap*(.34+.34*p));
 const height=Math.min(24*scale,Math.max(16,stageH*.018));
 return {x,y,scale,travel,p,angle,tangent,width,height};
}

function segmentForHold(n,now,stageH,stageW){
 const a=position(n,now,stageH,stageW);
 const endT=n.t+n.hold;
 const fake={...n,t:endT};
 const b=position(fake,now,stageH,stageW);
 const ax=a.x*stageW/100, bx=b.x*stageW/100;
 const ay=a.y, by=b.y;
 const mx=(ax+bx)/2,my=(ay+by)/2;
 const len=Math.max(12,Math.hypot(bx-ax,by-ay));
 const angle=Math.atan2(by-ay,bx-ax)*180/Math.PI;
 return {a,b,mx,my,len,angle};
}
function qSpawnReady(n,now,stageH,stageW){
 const q=position(n,now,stageH,stageW);
 return q.p>=0.055;
}

function draw(){
 if(!playing)return;
 if(!audio){raf=requestAnimationFrame(draw);return;}
 const now=audio.currentTime;
 const stage=$("stage");
 const stageW=stage.clientWidth;
 for(const n of notes){
  if(n.hit)continue;
  const dt=n.t-now;
  if(!n.el && dt<1.95 && dt>-.28 && qSpawnReady(n,now,stage.clientHeight,stageW)){
    n.el=document.createElement("div");n.el.className="note "+n.type;
    $("stage").appendChild(n.el);
    if(n.type==="hold"){n.body=document.createElement("div");n.body.className="holdBody";$("stage").appendChild(n.body)}
  }
  if(n.el){
    const q=position(n,now,stage.clientHeight,stageW);
    // レイアウトを毎フレーム動かさず、GPUで処理しやすい transform に集約する。
    // left/top の変更は再レイアウトを誘発しやすいため、iPadでは特に重くなりやすい。
    const sx = q.x * stageW / 100;
    // サイズ変更もtransform内で行い、毎フレームの再レイアウトを避ける。
    const sxNote=q.width/120, syNote=q.height/40;
    n.el.style.transform=`translate3d(${sx}px,${q.y}px,0) translate(-50%,-50%) rotate(${q.angle}deg) scale(${sxNote},${syNote})`;
    if(n.body){
      // ロングノーツは「レーンの中心線」そのものに沿って、始点と終点を結ぶ。
      // これで斜めレーンでも本体が曲がった向きに自然に追従する。
      const seg=segmentForHold(n,now,stage.clientHeight,stageW);
      n.body.style.width=seg.len+"px";
      n.body.style.height=Math.max(6,Math.min(12,q.height*.42))+"px";
      n.body.style.transform=`translate3d(${seg.mx}px,${seg.my}px,0) translate(-50%,-50%) rotate(${seg.angle}deg)`;
      n.body.style.transformOrigin="center center";
    }
  }
  if(dt<-.23 && n.el){n.el.remove();n.body?.remove();n.hit=true;combo=0;setLife(life-4);$("combo").textContent=""}
 }
 raf=requestAnimationFrame(draw);
}

function showJudge(t){const j=$("judge");j.textContent=t;j.classList.remove("show");void j.offsetWidth;j.classList.add("show")}

function hit(lane){
 if(!playing||!audio)return;
 const now=audio.currentTime+(offsetMs/1000);let best=null,bestAbs=999;
 for(const n of notes){if(n.hit||n.lane!==lane)continue;const a=Math.abs(n.t-now);if(a<bestAbs){best=n;bestAbs=a}}
 if(!best||bestAbs>.20)return;
 best.hit=true;best.el?.remove();best.body?.remove();
 setLife(life+0.4);
 let q="GOOD",pts=500;if(bestAbs<=.055){q="PERFECT";pts=1000}else if(bestAbs<=.115){q="GREAT";pts=800}
 combo++;score+=pts+combo*10;$("score").textContent=$("score2").textContent=score;$("combo").textContent=combo+" COMBO";showJudge(q)
}

function start(){
 reset(); const s=songs[selected];
 notes=buildChart(s.title);
 audio=new Audio();
 audio.preload="auto";
 audio.playsInline=true;
 audio.setAttribute("playsinline","");
 audio.src=s.src;
 playing=true;
 draw();
 const playPromise=audio.play();
 if(playPromise!==undefined){
   playPromise.catch(()=>{
     playing=false;cancelAnimationFrame(raf);
     alert("音声を再生できませんでした。もう一度スタートをタップしてください。");
   });
 }
 audio.addEventListener("ended",()=>{playing=false;cancelAnimationFrame(raf);showJudge("CLEAR!")},{once:true});
}

document.querySelectorAll(".tapkey").forEach(b=>{
 const lane=+b.dataset.lane;
 const down=e=>{e.preventDefault();b.classList.add("active");hit(lane)};
 const up=e=>{e.preventDefault();b.classList.remove("active")};
 b.addEventListener("pointerdown",down);b.addEventListener("pointerup",up);b.addEventListener("pointercancel",up);b.addEventListener("pointerleave",up)
});
document.querySelectorAll("#laneTouch button").forEach(b=>{
 const lane=+b.dataset.lane;
 b.addEventListener("pointerdown",e=>{e.preventDefault();b.setPointerCapture?.(e.pointerId);hit(lane)});
});
document.addEventListener("keydown",e=>{
 if(e.repeat)return;const map={a:0,s:1,d:2,k:3,l:4,ArrowLeft:0,ArrowDown:1,ArrowUp:3,ArrowRight:4},lane=map[e.key];
 if(lane!==undefined){e.preventDefault();hit(lane)}
});
$("start").onclick=start;$("reset").onclick=reset;
</script>

<script>
// iOS/iPadOS: keep the game viewport stable and make touch interaction feel native.
document.addEventListener('gesturestart',e=>e.preventDefault(),{passive:false});
document.addEventListener('gesturechange',e=>e.preventDefault(),{passive:false});
</script>
