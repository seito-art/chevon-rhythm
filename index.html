.l1{left:20%;transform:skewX(-21deg)}.l2{left:40%;transform:skewX(-10deg)}.l3{left:60%;transform:skewX(10deg)}.l4{left:80%;transform:skewX(21deg)}
.spotlight{position:absolute;top:-8%;width:34%;height:72%;pointer-events:none;opacity:.24;filter:blur(12px);background:linear-gradient(180deg,rgba(154,128,255,.42),transparent 75%);transform-origin:top}.spotlight.left{left:4%;transform:rotate(15deg) skewX(-10deg)}.spotlight.right{right:4%;transform:rotate(-15deg) skewX(10deg)}

/* Original difficulty selector inspired by modern mobile rhythm-game hierarchy */
.prosekaDiffs{display:flex;justify-content:center;align-items:flex-end;gap:10px;margin:14px auto 8px;max-width:680px}
.prosekaDiffs .diff{
  position:relative;width:92px;height:74px;padding:7px 5px 8px;
  border:2px solid rgba(255,255,255,.22);border-radius:13px;
  background:rgba(20,23,38,.86);color:#fff;box-shadow:0 5px 16px #0008;
  transform:translateY(0);transition:.16s;cursor:pointer;overflow:hidden
}
.prosekaDiffs .diff span{display:block;font-size:10px;font-weight:800;letter-spacing:.7px}
.prosekaDiffs .diff b{display:block;font-size:28px;line-height:1.05;margin-top:5px}
.prosekaDiffs .diff:after{content:"";position:absolute;left:0;right:0;bottom:0;height:5px;background:#777}
.prosekaDiffs .d-easy:after{background:#63d66e}.prosekaDiffs .d-normal:after{background:#55c8ef}
.prosekaDiffs .d-hard:after{background:#ffae4f}.prosekaDiffs .d-expert:after{background:#ff5964}
.prosekaDiffs .d-master:after{background:#b77cff}
.prosekaDiffs .diff.active{transform:translateY(-8px) scale(1.04);border-color:#fff;background:rgba(44,48,72,.96);box-shadow:0 10px 24px #000b,0 0 18px #fff4}
.prosekaDiffs .d-easy.active{box-shadow:0 10px 24px #000b,0 0 18px #63d66e66}

.prosekaDiffs .d-hard.active{box-shadow:0 10px 24px #000b,0 0 18px #ffae4f66}
.prosekaDiffs .d-expert.active{box-shadow:0 10px 24px #000b,0 0 18px #ff596466}
.prosekaDiffs .d-master.active{box-shadow:0 10px 24px #000b,0 0 18px #b77cff66}

 .prosekaDiffs{gap:5px;margin-top:9px}

<body>
<div class="wrap">
<header><div><h1>🎵 CHEVON 3D Rhythm Stage</h1><div class="sub">5レーン / 3D遠近 / 四角ノーツ / iPadマルチタッチ対応</div></div></header>
<div class="panel selectPanel">
<div class="selectTitle"><b>曲を選ぶ</b><small>曲をタップすると難易度を選択できます</small></div>
<div id="songs" class="songgrid"></div>
<div id="difficultyScreen" class="difficultyScreen" hidden>
  <div class="difficultyHead"><button id="backSongs" class="secondary" type="button">‹ 曲一覧</button><div><small>SELECT DIFFICULTY</small><strong id="selectedSongTitle">B612</strong></div></div>
  <div class="diffs prosekaDiffs">
  <button class="diff active d-easy" data-d="簡単"><span>EASY</span><b>5</b></button>

function buildChart(title){
 const raw=syncData[title]; if(!raw)return [];
 const ev=raw.events||[];
 const cfg={"簡単":{gap:.46,rate:.34},"普通":{gap:.29,rate:.52},"難しい":{gap:.18,rate:.68},"鬼":{gap:.12,rate:.84},"裏鬼":{gap:.085,rate:.96}}[diff]||{gap:.29,rate:.52};
 // ノーツ時刻は音源解析で検出したアタック時刻をそのまま使用。後から拍に丸めたりランダムにずらしたりしない。
 const pv=ev.map(e=>e[3]).filter(v=>v>0).sort((a,b)=>a-b);
 const p10=pv[Math.floor(pv.length*.10)]||48, p90=pv[Math.floor(pv.length*.90)]||84;
 const out=[]; let last=-999,lastLane=-1;
 for(let i=0;i<ev.length;i++){
  const [t,str,comp,midi]=ev[i]; if(t<.65||t>raw.duration-.35)continue;
  const strength=Math.max(0,Math.min(1,str));
  // 難易度による間引きは「弱いイベントから」行い、残したイベントの時刻は変更しない。
  const threshold=.22+(1-cfg.rate)*.30;
  if(strength+(comp===1?.08:.03)<threshold)continue;
  if(t-last<cfg.gap)continue;
  let lane;
  if(comp===1 && midi>0){
   lane=Math.max(0,Math.min(4,Math.round((midi-p10)/Math.max(1,p90-p10)*4)));
   if(lane===lastLane && Math.abs(midi-(ev[i-1]?.[3]||midi))>2) lane=Math.max(0,Math.min(4,lane+(midi>(ev[i-1]?.[3]||midi)?1:-1)));
  }else{
   const drumPattern=[1,3,1,4,2,3,0,2]; lane=drumPattern[i%drumPattern.length]; if(lane===lastLane)lane=(lane+2)%5;
  }
  let type='tap';
  if((diff==='鬼'||diff==='裏鬼')&&strength>.86&&i%13===0)type='flick';
  // 強い発音は、難易度に応じてロングノーツ化。頭を叩いた後も終点まで保持する。
  let hold=0;
  if((diff==='難しい'||diff==='鬼'||diff==='裏鬼') && strength>.72 && i+1<ev.length){
    const nextT=ev[i+1][0];
    const gap=nextT-t;
    if(gap>=.42 && gap<=1.35) hold=Math.min(1.15,Math.max(.42,gap*.72));
  }
  out.push({t,lane,type,hold,hit:false,holding:false,holdStarted:false}); last=t; lastLane=lane;
  if((diff==='鬼'||diff==='裏鬼')&&strength>.96&&i%19===0)out.push({t,lane:(lane+2)%5,type:'tap',hold:0,hit:false,holding:false,holdStarted:false});
 }
 return out.sort((a,b)=>a.t-b.t||a.lane-b.lane);
}

function position(n,now,stageH,stageW){
 const d=difficulties[diff],travel=d.speed*speedMult,dt=n.t-now,target=stageH-77;
 const travelWindow=1.95/Math.max(.6,speedMult);
 const p=Math.max(0,Math.min(1,1-dt/travelWindow));
 // SVGの6本の境界線から求めた「5レーンの中心」。
 // 左から 40/44/48/52/56 → 4/22/39/61/78 の境界の中点。
 const laneTop=[42,46,50,54,58];
 const laneBottom=[13,30.5,50,69.5,87];
 const depth=Math.pow(p,1.32);
 const y=18+(target-18)*depth;
 // SVGと同じ座標系：ステージ上端からの割合でXを決める。
 const yRatio=Math.max(0,Math.min(1,y/stageH));
 const x=laneTop[n.lane]+(laneBottom[n.lane]-laneTop[n.lane])*yRatio;
 const p2=Math.min(1,p+.012),depth2=Math.pow(p2,1.32);
 const y2=18+(target-18)*depth2;
 const yRatio2=Math.max(0,Math.min(1,y2/stageH));
 const x2=laneTop[n.lane]+(laneBottom[n.lane]-laneTop[n.lane])*yRatio2;
 const dx=(x2-x)*stageW/100,dy=y2-y;
 const angle=Math.atan2(dy,dx)*180/Math.PI;
 const scale=.46+1.78*Math.pow(p,1.08);
 const laneGap=stageW*(17.5/100);
 const width=Math.min(78*scale,laneGap*(.34+.34*p));
 const height=Math.min(24*scale,Math.max(16,stageH*.018));
 return {x,y,scale,travel,p,angle,width:Math.max(42,width),height:Math.max(18,height)};
}

function segmentForHold(n,now,stageH,stageW){
 const a=position(n,now,stageH,stageW);
 const endT=n.t+n.hold;
 const fake={...n,t:endT};
 const b=position(fake,now,stageH,stageW);
 const ax=a.x*stageW/100, bx=b.x*stageW/100;
 const ay=a.y, by=b.y;
 const mx=(ax+bx)/2,my=(ay+by)/2;
 const len=Math.max(12,Math.hypot(bx-ax,by-ay));
 const angle=Math.atan2(by-ay,bx-ax)*180/Math.PI;
 return {a,b,mx,my,len,angle};
}
function qSpawnReady(n,now,stageH,stageW){

   if(n.type==='hold' && n.holdStarted){

  src.buffer=buf;src.connect(filter);filter.connect(g);g.connect(tapAudioCtx.destination);src.start(t);src.stop(t+dur);
  [3100,4700,6900].forEach((f0,j)=>{
    const o=tapAudioCtx.createOscillator(), og=tapAudioCtx.createGain();o.type="triangle";o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f0*.88,t+.055);
    og.gain.setValueAtTime(.0001,t);og.gain.exponentialRampToValueAtTime(.075/(j+1),t+.002);og.gain.exponentialRampToValueAtTime(.0001,t+.065);
    o.connect(og);og.connect(tapAudioCtx.destination);o.start(t);o.stop(t+.07);
  });
 }catch(e){}
}
function hit(lane){
 if(!playing||!audio)return;
 const now=audio.currentTime+(offsetMs/1000);let best=null,bestAbs=999;
 for(const n of notes){if(n.hit||n.lane!==lane)continue;const a=Math.abs(n.t-now);if(a<bestAbs){best=n;bestAbs=a}}
 if(!best||bestAbs>.28)return;
 playOriginalTapSound();
 setLife(life+0.4);
 let q='GOOD',pts=500;if(bestAbs<=.075){q='PERFECT';pts=1000}else if(bestAbs<=.17){q='GREAT';pts=800}
 combo++;score+=pts+combo*10;$('score').textContent=$('score2').textContent=score;$('combo').textContent=combo+' COMBO';showJudge(best.type==='hold'?'HOLD '+q:q);
 if(best.type==='hold'){
   best.holdStarted=true; best.holding=true;
   // 頭だけ消し、ロング本体は終点まで残す。
 }else{
   best.hit=true;best.el?.remove();best.body?.remove();
 }
}

function releaseLane(lane){
 if(!playing||!audio)return;
 const now=audio.currentTime+(offsetMs/1000);
 for(const n of notes){
   if(n.type==='hold' && n.holdStarted && n.holding && n.lane===lane){
     if(now < n.t+n.hold-0.06){
       n.holding=false;n.hit=true;combo=0;setLife(life-5);$('combo').textContent='';showJudge('MISS');
       n.el?.remove();n.body?.remove();
     } else {
       n.holding=false;
     }
   }
 }
}

function start(){
 reset(); const s=songs[selected];
 songsEl.closest('.selectPanel').style.display='none';
 difficultyScreen.hidden=true;
 const gs=$('gameScreen');gs.classList.add('active');
 applyZoom();
 notes=buildChart(s.title);
 audio=new Audio();
 audio.preload="auto";
 audio.playsInline=true;
 audio.setAttribute("playsinline","");
 audio.src=s.src;
 playing=true;
 draw();
 const playPromise=audio.play();
 if(playPromise!==undefined){
   playPromise.catch(()=>{
     playing=false;cancelAnimationFrame(raf);
     alert("音声を再生できませんでした。もう一度スタートをタップしてください。");
   });
 }
 audio.addEventListener("ended",()=>{playing=false;cancelAnimationFrame(raf);showJudge("CLEAR!")},{once:true});
}

let zoomLevel=1;
function applyZoom(){
 const el=$('gameStageScale'),out=$('zoomVal');
 if(el)el.style.transform=`scale(${zoomLevel})`;
 if(out)out.value=Math.round(zoomLevel*100)+'%';
}
function setZoom(v){zoomLevel=Math.max(.65,Math.min(1.65,v));applyZoom();}
$('zoomOut').onclick=()=>setZoom(zoomLevel-.1);
$('zoomIn').onclick=()=>setZoom(zoomLevel+.1);
$('exitGame').onclick=()=>{reset();$('gameScreen').classList.remove('active');songsEl.closest('.selectPanel').style.display='block';difficultyScreen.hidden=false;songsEl.hidden=true;};
applyZoom();

document.querySelectorAll(".tapkey").forEach(b=>{
 const lane=+b.dataset.lane;
 const down=e=>{e.preventDefault();b.classList.add("active");if(tapAudioCtx?.state==="suspended")tapAudioCtx.resume();hit(lane)};
 const up=e=>{e.preventDefault();b.classList.remove("active")};
 b.addEventListener("pointerdown",down);b.addEventListener("pointerup",e=>{up(e);releaseLane(lane)});b.addEventListener("pointercancel",e=>{up(e);releaseLane(lane)})
});
document.querySelectorAll("#laneTouch button").forEach(b=>{
 const lane=+b.dataset.lane;
 b.addEventListener("pointerdown",e=>{e.preventDefault();b.setPointerCapture?.(e.pointerId);if(tapAudioCtx?.state==="suspended")tapAudioCtx.resume();hit(lane)});
});
document.addEventListener("keydown",e=>{
 if(e.repeat)return;const map={a:0,s:1,d:2,k:3,l:4,ArrowLeft:0,ArrowDown:1,ArrowUp:3,ArrowRight:4},lane=map[e.key];
 if(lane!==undefined){e.preventDefault();hit(lane)}
});
document.addEventListener('keyup',e=>{const map={a:0,s:1,d:2,k:3,l:4,ArrowLeft:0,ArrowDown:1,ArrowUp:3,ArrowRight:4},lane=map[e.key];if(lane!==undefined){e.preventDefault();releaseLane(lane)}});
document.addEventListener('selectstart',e=>e.preventDefault());
$("start").onclick=start;$("reset").onclick=reset;
</script>
